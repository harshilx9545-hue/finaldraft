[pytest]
# Django integration (pytest-django)
DJANGO_SETTINGS_MODULE = gymapp.settings

# Make the project root importable so `gymapp` and `core` resolve when pytest
# is invoked from anywhere inside the repository.
pythonpath = .

# Test discovery
testpaths = core/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Registered markers. --strict-markers turns a typo'd marker into an error
# instead of a silently ignored test selector.
markers =
    integration: talks to the real Razorpay sandbox over the network; excluded from the default run (run with `-m integration`)
    slow: noticeably slower than the rest of the suite (concurrency / stateful properties)

# Gateway integration tests are opt-in: the default run stays offline and
# deterministic. Override on the command line with `-m integration` or `-m ""`.
addopts =
    --strict-markers
    --strict-config
    -m "not integration"
    --reuse-db
